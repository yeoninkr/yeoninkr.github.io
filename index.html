<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Kim Gayeon Portfolio</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #fff0f5;
}

/* 헤더 */
header {
    background: url('aurora.jpg');
    background-size: cover;
    background-position: center;
    text-align: center;
    padding: 80px 20px;
    color: white;
    animation: auroraMove 20s infinite alternate;
}

/* 프로필 사진 */
.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 15px;
}

/* 카드 */
section {
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s;
}

/* 호버 효과 */
.card:hover {
    transform: translateY(-5px);
}

/* 버튼 */
.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #ff6f91;
    color: white;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 20px;
    color: gray;
}
</style>
</head>

    <img src="profile.jpg" class="profile-img">
    <h1>김가연</h1>

</div>

<div class="card">
